name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pip-audit==2.10.1
          npm ci

      - name: Compile Python modules
        run: |
          python -m py_compile \
            app/main.py \
            app/settings.py \
            app/repository.py \
            app/models.py \
            app/services/jd_strategy.py \
            app/services/ncs_mcp_client.py \
            app/services/question_generation.py \
            app/services/kordoc_parser.py \
            app/services/external_api.py \
            scripts/benchmark_alio_jd.py

      - name: Run tests
        env:
          NCS_MCP_URL: http://mcp.example/mcp
          OPENAI_NET_CHECK_ENABLED: "false"
        run: python -m pytest -q

      - name: Run Ruff
        run: ruff check --select F821 app scripts tests

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
